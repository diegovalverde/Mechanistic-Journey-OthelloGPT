<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
<title id="title">Evidence ladder for rule circuits</title>
<desc id="desc">Evidence frontier for Chapter 9 rule-circuit hunting.</desc>
<style>
svg{color-scheme:light dark;--text:#172033;--muted:#5c667a;--grid:#d8dde8;--fill:#f7f9fc;--target:#f2c94c;--opp:#cc4b37;--mine:#246bfe;--empty:#b8c0d0;--teal:#0f8f7f;--weak:#9aa3b7}
@media(prefers-color-scheme:dark){svg{--text:#eef2ff;--muted:#b7bfd1;--grid:#384153;--fill:#1f2633;--target:#ffd766;--opp:#ff8f7d;--mine:#86a9ff;--empty:#5a6578;--teal:#5fd4c7;--weak:#808ba0}}
.title{font:700 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--text)}.label{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--text)}.small{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--muted)}
.box{fill:var(--fill);stroke:var(--grid);stroke-width:1.3;rx:8}.line{stroke:var(--grid);stroke-width:2;fill:none;marker-end:url(#arrow)}.teal{stroke:var(--teal);stroke-width:3;fill:none;marker-end:url(#arrowTeal)}.weak{stroke:var(--weak);stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#arrowWeak)}
.target{fill:var(--target);stroke:var(--grid);stroke-width:1.2}.opp{fill:var(--opp);stroke:var(--grid);stroke-width:1.2}.mine{fill:var(--mine);stroke:var(--grid);stroke-width:1.2}.empty{fill:var(--empty);stroke:var(--grid);stroke-width:1.2}.frontier{stroke:var(--opp);stroke-width:2.4;stroke-dasharray:7 5}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5c667a"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8f7f"/></marker>
<marker id="arrowWeak" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9aa3b7"/></marker>
</defs>
<text class="title" x="42" y="44">Evidence frontier after hunting rule circuits</text>
<rect class="box" x="230" y="76" width="330" height="26"/><text class="label" x="395" y="94" text-anchor="middle">Behavior</text><text class="small" x="580" y="94">established</text><path class="line" d="M395 102 L395 112"/><rect class="box" x="230" y="112" width="330" height="26"/><text class="label" x="395" y="130" text-anchor="middle">Board representation</text><text class="small" x="580" y="130">strong</text><path class="line" d="M395 138 L395 148"/><rect class="box" x="230" y="148" width="330" height="26"/><text class="label" x="395" y="166" text-anchor="middle">Semantic causality</text><text class="small" x="580" y="166">strong</text><path class="line" d="M395 174 L395 184"/><rect class="box" x="230" y="184" width="330" height="26"/><text class="label" x="395" y="202" text-anchor="middle">Layer-7 localization</text><text class="small" x="580" y="202">strong</text><path class="line" d="M395 210 L395 220"/><rect class="box" x="230" y="220" width="330" height="26"/><text class="label" x="395" y="238" text-anchor="middle">MLP7 localization</text><text class="small" x="580" y="238">strong</text><path class="line" d="M395 246 L395 256"/><rect class="box" x="230" y="256" width="330" height="26"/><text class="label" x="395" y="274" text-anchor="middle">candidate neuron population</text><text class="small" x="580" y="274">mixed / partial</text><path class="line" d="M395 282 L395 292"/><rect class="box" x="230" y="292" width="330" height="26"/><text class="label" x="395" y="310" text-anchor="middle">output-write geometry</text><text class="small" x="580" y="310">moderate</text><path class="line" d="M395 318 L395 328"/><rect class="box" x="230" y="328" width="330" height="26"/><text class="label" x="395" y="346" text-anchor="middle">small selected-neuron causality</text><text class="small" x="580" y="346">weak positive</text><path class="line" d="M395 354 L395 364"/><rect class="box" x="230" y="364" width="330" height="26"/><text class="label" x="395" y="382" text-anchor="middle">relational detector</text><text class="small" x="580" y="382">open</text><path class="line" d="M395 390 L395 400"/><rect class="box" x="230" y="400" width="330" height="26"/><text class="label" x="395" y="418" text-anchor="middle">path mediation</text><text class="small" x="580" y="418">open</text><path class="line" d="M395 426 L395 436"/><rect class="box" x="230" y="436" width="330" height="26"/><text class="label" x="395" y="454" text-anchor="middle">rescue / sufficiency</text><text class="small" x="580" y="454">open</text><path class="line" d="M395 462 L395 472"/><rect class="box" x="230" y="472" width="330" height="26"/><text class="label" x="395" y="490" text-anchor="middle">complete algorithmic circuit</text><text class="small" x="580" y="490">not established</text>
<line class="frontier" x1="190" y1="253" x2="722" y2="253"/><text class="small" x="42" y="257">strong evidence frontier</text>
<line class="frontier" x1="190" y1="361" x2="722" y2="361"/><text class="small" x="42" y="365">mixed neuron frontier</text>
</svg>
