<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Observation versus intervention</title>
  <desc id="desc">A side-by-side diagram contrasting reading a board label with a probe and editing an activation to test whether model logits change.</desc>
  <defs>
    <style>
      :root { --bg:#ffffff; --ink:#172033; --muted:#475569; --stroke:#94a3b8; --read:#0f766e; --read-soft:#ccfbf1; --act:#7c3aed; --act-soft:#ede9fe; --model:#2563eb; --model-soft:#dbeafe; }
      @media (prefers-color-scheme: dark) { :root { --bg:#111827; --ink:#f8fafc; --muted:#cbd5e1; --stroke:#64748b; --read:#5eead4; --read-soft:#134e4a; --act:#c084fc; --act-soft:#3b225c; --model:#60a5fa; --model-soft:#1e3a8a; } }
      .title { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .heading { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .label { font: 650 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
      .box { fill: var(--bg); stroke: var(--stroke); stroke-width: 1.5; rx: 8; }
      .read { fill: var(--read-soft); stroke: var(--read); stroke-width: 1.8; rx: 8; }
      .act { fill: var(--act-soft); stroke: var(--act); stroke-width: 1.8; rx: 8; }
      .model { fill: var(--model-soft); stroke: var(--model); stroke-width: 1.8; rx: 8; }
      .arrow { stroke: var(--stroke); stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .readArrow { stroke: var(--read); stroke-width: 2.8; fill: none; marker-end: url(#readArrow); }
      .actArrow { stroke: var(--act); stroke-width: 2.8; fill: none; marker-end: url(#actArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--stroke)"/></marker>
    <marker id="readArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--read)"/></marker>
    <marker id="actArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--act)"/></marker>
  </defs>
  <rect width="980" height="430" fill="var(--bg)" rx="12"/>
  <text x="490" y="40" text-anchor="middle" class="title">Observation and Intervention Ask Different Questions</text>

  <g transform="translate(48 82)">
    <text x="215" y="0" text-anchor="middle" class="heading">Observation</text>
    <text x="215" y="28" text-anchor="middle" class="small">What can we read?</text>
    <rect x="0" y="72" width="132" height="64" class="box"/>
    <text x="66" y="110" text-anchor="middle" class="label">activation h</text>
    <path d="M136 104 L194 104" class="readArrow"/>
    <rect x="202" y="72" width="132" height="64" class="read"/>
    <text x="268" y="101" text-anchor="middle" class="label">probe</text>
    <text x="268" y="121" text-anchor="middle" class="small">external reader</text>
    <path d="M338 104 L396 104" class="readArrow"/>
    <rect x="404" y="72" width="132" height="64" class="read"/>
    <text x="470" y="101" text-anchor="middle" class="label">board label</text>
    <text x="470" y="121" text-anchor="middle" class="small">D3 = theirs</text>
  </g>

  <line x1="490" y1="88" x2="490" y2="362" stroke="var(--stroke)" stroke-width="1.4" stroke-dasharray="6 6"/>

  <g transform="translate(536 82)">
    <text x="205" y="0" text-anchor="middle" class="heading">Intervention</text>
    <text x="205" y="28" text-anchor="middle" class="small">What does changing it do?</text>
    <rect x="0" y="72" width="122" height="64" class="box"/>
    <text x="61" y="110" text-anchor="middle" class="label">activation h</text>
    <path d="M126 104 L171 104" class="actArrow"/>
    <rect x="180" y="72" width="130" height="64" class="act"/>
    <text x="245" y="98" text-anchor="middle" class="label">controlled edit</text>
    <text x="245" y="121" text-anchor="middle" class="small">h + alpha v</text>
    <path d="M314 104 L359 104" class="actArrow"/>
    <rect x="368" y="72" width="126" height="64" class="model"/>
    <text x="431" y="98" text-anchor="middle" class="label">continuation</text>
    <text x="431" y="121" text-anchor="middle" class="small">later layers</text>
    <path d="M431 140 L431 185" class="actArrow"/>
    <rect x="350" y="194" width="162" height="64" class="act"/>
    <text x="431" y="222" text-anchor="middle" class="label">changed logits?</text>
    <text x="431" y="244" text-anchor="middle" class="small">Delta z_m</text>
  </g>
</svg>
