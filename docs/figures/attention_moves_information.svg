<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">Attention can move information across positions</title>
  <desc id="desc">Earlier move positions feed the current position through attention arrows.</desc>
  <style>
  svg {
    color-scheme: light dark;
    --text: #172033;
    --muted: #5e687c;
    --line: #243045;
    --grid: #d7dde8;
    --fill: #f7f9fc;
    --blue: #246bfe;
    --teal: #0f8f7f;
    --gold: #b98113;
    --red: #cc4b37;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --text: #eef2ff;
      --muted: #b8c1d3;
      --line: #dce3f7;
      --grid: #3b4558;
      --fill: #1f2633;
      --blue: #86a9ff;
      --teal: #5fd4c7;
      --gold: #ffd27a;
      --red: #ff8f7d;
    }
  }
  .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .label { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .small { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .tiny { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .box { fill: var(--fill); stroke: var(--grid); stroke-width: 1.4; rx: 8; }
  .pill { fill: transparent; stroke: var(--grid); stroke-width: 1.4; rx: 18; }
  .line { stroke: var(--line); stroke-width: 2.2; fill: none; }
  .dash { stroke: var(--grid); stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
  .arrow { stroke: var(--line); stroke-width: 2.2; fill: none; marker-end: url(#arrowLine); }
  .arrow-blue { stroke: var(--blue); stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
  .arrow-teal { stroke: var(--teal); stroke-width: 3; fill: none; marker-end: url(#arrowTeal); }
  .arrow-gold { stroke: var(--gold); stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
  .arrow-red { stroke: var(--red); stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
  .node { fill: var(--fill); stroke: var(--line); stroke-width: 1.6; }
</style>
  <defs>
  <marker id="arrowLine" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243045"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#246bfe"/></marker>
  <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8f7f"/></marker>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b98113"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#cc4b37"/></marker>
</defs>
  <text class="title" x="42" y="44">Attention can mix positions</text>
  <circle class="node" cx="90" cy="240" r="34"/>
  <text class="label" x="90" y="246" text-anchor="middle">D3</text>
  <text class="tiny" x="90" y="298" text-anchor="middle">512-D row</text>
  <circle class="node" cx="200" cy="240" r="34"/>
  <text class="label" x="200" y="246" text-anchor="middle">C3</text>
  <text class="tiny" x="200" y="298" text-anchor="middle">512-D row</text>
  <circle class="node" cx="310" cy="240" r="34"/>
  <text class="label" x="310" y="246" text-anchor="middle">B3</text>
  <text class="tiny" x="310" y="298" text-anchor="middle">512-D row</text>
  <circle class="node" cx="420" cy="240" r="34"/>
  <text class="label" x="420" y="246" text-anchor="middle">B2</text>
  <text class="tiny" x="420" y="298" text-anchor="middle">512-D row</text>
  <circle class="node" cx="530" cy="240" r="34"/>
  <text class="label" x="530" y="246" text-anchor="middle">B1</text>
  <text class="tiny" x="530" y="298" text-anchor="middle">512-D row</text>
  <circle class="node" cx="640" cy="240" r="34"/>
  <text class="label" x="640" y="246" text-anchor="middle">A1</text>
  <text class="tiny" x="640" y="298" text-anchor="middle">512-D row</text>
  <circle class="node" cx="750" cy="240" r="34"/>
  <text class="label" x="750" y="246" text-anchor="middle">current</text>
  <text class="tiny" x="750" y="298" text-anchor="middle">512-D row</text>
  <path class="arrow-blue" d="M90 205 C160 95, 690 95, 750 205"/>
  <path class="arrow-teal" d="M200 205 C270 95, 690 95, 750 205"/>
  <path class="arrow-gold" d="M310 205 C380 95, 690 95, 750 205"/>
  <path class="arrow-red" d="M530 205 C600 95, 690 95, 750 205"/>
  <path class="arrow-blue" d="M640 205 C710 95, 690 95, 750 205"/>
  <text class="small" x="74" y="365">Architectural possibility: earlier positions can write information into the current residual position.</text>
  <text class="small" x="74" y="390">This is not a discovered Othello circuit.</text>
</svg>
