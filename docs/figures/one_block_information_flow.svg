<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">Information flow through one block</title>
  <desc id="desc">Current residual state is updated by attention and then by a position-wise MLP.</desc>
  <style>
  svg {
    color-scheme: light dark;
    --text: #172033;
    --muted: #5e687c;
    --line: #243045;
    --grid: #d7dde8;
    --fill: #f7f9fc;
    --blue: #246bfe;
    --teal: #0f8f7f;
    --gold: #b98113;
    --red: #cc4b37;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --text: #eef2ff;
      --muted: #b8c1d3;
      --line: #dce3f7;
      --grid: #3b4558;
      --fill: #1f2633;
      --blue: #86a9ff;
      --teal: #5fd4c7;
      --gold: #ffd27a;
      --red: #ff8f7d;
    }
  }
  .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .label { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .small { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .tiny { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .box { fill: var(--fill); stroke: var(--grid); stroke-width: 1.4; rx: 8; }
  .pill { fill: transparent; stroke: var(--grid); stroke-width: 1.4; rx: 18; }
  .line { stroke: var(--line); stroke-width: 2.2; fill: none; }
  .dash { stroke: var(--grid); stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
  .arrow { stroke: var(--line); stroke-width: 2.2; fill: none; marker-end: url(#arrowLine); }
  .arrow-blue { stroke: var(--blue); stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
  .arrow-teal { stroke: var(--teal); stroke-width: 3; fill: none; marker-end: url(#arrowTeal); }
  .arrow-gold { stroke: var(--gold); stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
  .arrow-red { stroke: var(--red); stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
  .node { fill: var(--fill); stroke: var(--line); stroke-width: 1.6; }
</style>
  <defs>
  <marker id="arrowLine" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243045"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#246bfe"/></marker>
  <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8f7f"/></marker>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b98113"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#cc4b37"/></marker>
</defs>
  <text class="title" x="42" y="44">Information flow through one block</text>
  <rect class="box" x="70" y="210" width="160" height="70"/>
  <text class="label" x="150.0" y="238" text-anchor="middle">move history</text>
  <text class="small" x="150.0" y="260" text-anchor="middle">token positions</text>
  <rect class="box" x="325" y="95" width="180" height="70"/>
  <text class="label" x="415.0" y="123" text-anchor="middle">attention</text>
  <text class="small" x="415.0" y="145" text-anchor="middle">mix positions</text>
  <rect class="box" x="325" y="325" width="180" height="70"/>
  <text class="label" x="415.0" y="353" text-anchor="middle">MLP</text>
  <text class="small" x="415.0" y="375" text-anchor="middle">position-wise</text>
  <rect class="box" x="590" y="210" width="170" height="70"/>
  <text class="label" x="675.0" y="238" text-anchor="middle">new residual</text>
  <text class="small" x="675.0" y="260" text-anchor="middle">512-D</text>
  <rect class="box" x="300" y="210" width="230" height="70"/>
  <text class="label" x="415.0" y="238" text-anchor="middle">current residual</text>
  <text class="small" x="415.0" y="260" text-anchor="middle">old + attn update</text>
  <path class="arrow-blue" d="M230 245 L300 245"/>
  <path class="arrow-teal" d="M185 210 C220 120, 280 115, 325 130"/>
  <path class="arrow-teal" d="M505 130 C575 145, 595 190, 530 225"/>
  <path class="arrow-gold" d="M415 280 L415 325"/>
  <path class="arrow-red" d="M505 360 C590 350, 615 310, 620 280"/>
  <path class="arrow" d="M530 245 L590 245"/>
  <text class="small" x="78" y="455">Attention can bring earlier-position information into the current row; the MLP transforms the row it receives.</text>
</svg>
