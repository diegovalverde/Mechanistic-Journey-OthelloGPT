<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">Strict game-level board-probe validation accuracy</title>
  <desc id="desc">A bar chart showing board-probe validation accuracy from zero to one hundred percent: overall 97.96 percent, empty 99.76 percent, mine 95.61 percent, and theirs 97.03 percent.</desc>
  <defs>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #172033;
        --muted: #475569;
        --grid: #cbd5e1;
        --axis: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --ink: #f8fafc;
          --muted: #cbd5e1;
          --grid: #334155;
          --axis: #94a3b8;
        }
      }
      .title { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .subtitle { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
      .label { font: 650 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .value { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .tick { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
      .axis-title { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
      .grid { stroke: var(--grid); stroke-width: 1; }
      .axis { stroke: var(--axis); stroke-width: 1.6; }
      .bar { stroke: rgba(15, 23, 42, 0.16); stroke-width: 1; }
      .note { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
    </style>
  </defs>
  <rect width="820" height="520" fill="var(--bg)" rx="10"/>
  <text x="410.0" y="38" text-anchor="middle" class="title">Board Probe Accuracy</text>
  <text x="410.0" y="64" text-anchor="middle" class="subtitle">Strict game-level held-out validation, 330 positions</text>
  
  <line x1="96" y1="382.0" x2="778" y2="382.0" class="grid"/>
  <text x="80" y="387.0" text-anchor="end" class="tick">0%</text>
  <line x1="96" y1="309.5" x2="778" y2="309.5" class="grid"/>
  <text x="80" y="314.5" text-anchor="end" class="tick">25%</text>
  <line x1="96" y1="237.0" x2="778" y2="237.0" class="grid"/>
  <text x="80" y="242.0" text-anchor="end" class="tick">50%</text>
  <line x1="96" y1="164.5" x2="778" y2="164.5" class="grid"/>
  <text x="80" y="169.5" text-anchor="end" class="tick">75%</text>
  <line x1="96" y1="92.0" x2="778" y2="92.0" class="grid"/>
  <text x="80" y="97.0" text-anchor="end" class="tick">100%</text>
  <line x1="96" y1="92" x2="96" y2="382" class="axis"/>
  <line x1="96" y1="382" x2="778" y2="382" class="axis"/>
  <text x="24" y="237.0" class="axis-title" transform="rotate(-90 24 237.0)" text-anchor="middle">validation accuracy</text>
  
  <g>
    <rect x="96.0" y="97.9" width="92" height="284.1" rx="5" class="bar" fill="#2563eb"/>
    <text x="142.0" y="85.9" text-anchor="middle" class="value">97.96%</text>
    <text x="142.0" y="416" text-anchor="middle" class="label">Overall</text>
  </g>
  <g>
    <rect x="292.7" y="92.7" width="92" height="289.3" rx="5" class="bar" fill="#0f766e"/>
    <text x="338.7" y="80.7" text-anchor="middle" class="value">99.76%</text>
    <text x="338.7" y="416" text-anchor="middle" class="label">Empty</text>
  </g>
  <g>
    <rect x="489.3" y="104.7" width="92" height="277.3" rx="5" class="bar" fill="#7c3aed"/>
    <text x="535.3" y="92.7" text-anchor="middle" class="value">95.61%</text>
    <text x="535.3" y="416" text-anchor="middle" class="label">Mine</text>
  </g>
  <g>
    <rect x="686.0" y="100.6" width="92" height="281.4" rx="5" class="bar" fill="#dc2626"/>
    <text x="732.0" y="88.6" text-anchor="middle" class="value">97.03%</text>
    <text x="732.0" y="416" text-anchor="middle" class="label">Theirs</text>
  </g>
  <text x="410.0" y="450" text-anchor="middle" class="note">Source: Othello_GPT_Jacobian_Lens.ipynb, section 7.</text>
  <text x="410.0" y="474" text-anchor="middle" class="note">Y-axis begins at 0; values are measured validation accuracies, not illustrative estimates.</text>
</svg>
