<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">TransformerLens hook map</title>
  <desc id="desc">Hook points in a single pre-norm Othello-GPT block.</desc>
  <style>
  svg {
    color-scheme: light dark;
    --text: #172033;
    --muted: #5e687c;
    --line: #243045;
    --grid: #d7dde8;
    --fill: #f7f9fc;
    --blue: #246bfe;
    --teal: #0f8f7f;
    --gold: #b98113;
    --red: #cc4b37;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --text: #eef2ff;
      --muted: #b8c1d3;
      --line: #dce3f7;
      --grid: #3b4558;
      --fill: #1f2633;
      --blue: #86a9ff;
      --teal: #5fd4c7;
      --gold: #ffd27a;
      --red: #ff8f7d;
    }
  }
  .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .label { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .small { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .tiny { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .box { fill: var(--fill); stroke: var(--grid); stroke-width: 1.4; rx: 8; }
  .pill { fill: transparent; stroke: var(--grid); stroke-width: 1.4; rx: 18; }
  .line { stroke: var(--line); stroke-width: 2.2; fill: none; }
  .dash { stroke: var(--grid); stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
  .arrow { stroke: var(--line); stroke-width: 2.2; fill: none; marker-end: url(#arrowLine); }
  .arrow-blue { stroke: var(--blue); stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
  .arrow-teal { stroke: var(--teal); stroke-width: 3; fill: none; marker-end: url(#arrowTeal); }
  .arrow-gold { stroke: var(--gold); stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
  .arrow-red { stroke: var(--red); stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
  .node { fill: var(--fill); stroke: var(--line); stroke-width: 1.6; }
</style>
  <defs>
  <marker id="arrowLine" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243045"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#246bfe"/></marker>
  <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8f7f"/></marker>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b98113"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#cc4b37"/></marker>
</defs>
  <text class="title" x="42" y="44">TransformerLens hook map</text>
  <rect class="box" x="80" y="105" width="230" height="55"/>
  <text class="label" x="195.0" y="133" text-anchor="middle">hook_resid_pre</text>
  <text class="small" x="345" y="139">residual before attention</text>
  <text class="tiny" x="675" y="139" text-anchor="middle">[batch, pos, 512]</text>
  <rect class="box" x="80" y="180" width="230" height="55"/>
  <text class="label" x="195.0" y="208" text-anchor="middle">hook_attn_out</text>
  <text class="small" x="345" y="214">attention update added to residual</text>
  <text class="tiny" x="675" y="214" text-anchor="middle">[batch, pos, 512]</text>
  <rect class="box" x="80" y="255" width="230" height="55"/>
  <text class="label" x="195.0" y="283" text-anchor="middle">hook_resid_mid</text>
  <text class="small" x="345" y="289">residual after attention add</text>
  <text class="tiny" x="675" y="289" text-anchor="middle">[batch, pos, 512]</text>
  <rect class="box" x="80" y="330" width="230" height="55"/>
  <text class="label" x="195.0" y="358" text-anchor="middle">hook_mlp_out</text>
  <text class="small" x="345" y="364">MLP update added to residual</text>
  <text class="tiny" x="675" y="364" text-anchor="middle">[batch, pos, 512]</text>
  <rect class="box" x="80" y="405" width="230" height="55"/>
  <text class="label" x="195.0" y="433" text-anchor="middle">hook_resid_post</text>
  <text class="small" x="345" y="439">residual after full block</text>
  <text class="tiny" x="675" y="439" text-anchor="middle">[batch, pos, 512]</text>
  <text class="small" x="88" y="478">Hooks are measurement and intervention points. They are not extra components in ordinary model inference.</text>
</svg>
