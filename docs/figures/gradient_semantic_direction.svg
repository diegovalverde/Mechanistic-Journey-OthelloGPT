<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Gradient and semantic direction</title>
  <desc id="desc">A 2D cartoon of 512-dimensional residual space showing a logit gradient, a semantic direction, a positive alignment angle, an orthogonal direction, and an opposite direction.</desc>
  <style>
    svg {
      color-scheme: light dark;
      --text: #172033;
      --muted: #5c667a;
      --grid: #d8dde8;
      --axis: #263247;
      --grad: #2563eb;
      --sem: #0f8f7f;
      --orth: #9a3412;
      --opp: #b91c1c;
      --origin: #111827;
      --angle: #a855f7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --text: #eef2ff;
        --muted: #b7bfd1;
        --grid: #384153;
        --axis: #dce4f4;
        --grad: #7aa7ff;
        --sem: #45d6c4;
        --orth: #fb923c;
        --opp: #f87171;
        --origin: #f8fafc;
        --angle: #c084fc;
      }
    }
    .title { fill: var(--text); font: 700 22px system-ui, -apple-system, Segoe UI, sans-serif; }
    .subtitle { fill: var(--muted); font: 14px system-ui, -apple-system, Segoe UI, sans-serif; }
    .label { fill: var(--text); font: 600 14px system-ui, -apple-system, Segoe UI, sans-serif; }
    .muted { fill: var(--muted); font: 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.6; }
    .grad { stroke: var(--grad); }
    .sem { stroke: var(--sem); }
    .orth { stroke: var(--orth); stroke-dasharray: 6 6; }
    .opp { stroke: var(--opp); stroke-dasharray: 6 6; }
    .arrow { stroke-width: 5; fill: none; marker-end: url(#arrow); }
    .angle { fill: none; stroke: var(--angle); stroke-width: 3; }
    .origin { fill: var(--origin); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <text class="title" x="58" y="38">Dot products compare directions</text>
  <text class="subtitle" x="58" y="62">2D cartoon of 512-dimensional residual space</text>

  <line class="grid" x1="110" y1="390" x2="690" y2="390"/>
  <line class="grid" x1="110" y1="300" x2="690" y2="300"/>
  <line class="grid" x1="110" y1="210" x2="690" y2="210"/>
  <line class="grid" x1="110" y1="120" x2="690" y2="120"/>
  <line class="grid" x1="210" y1="90" x2="210" y2="415"/>
  <line class="grid" x1="330" y1="90" x2="330" y2="415"/>
  <line class="grid" x1="450" y1="90" x2="450" y2="415"/>
  <line class="grid" x1="570" y1="90" x2="570" y2="415"/>
  <line class="axis" x1="110" y1="300" x2="700" y2="300"/>
  <line class="axis" x1="330" y1="415" x2="330" y2="80"/>

  <circle class="origin" cx="330" cy="300" r="5"/>
  <line class="arrow grad" x1="330" y1="300" x2="560" y2="155"/>
  <line class="arrow sem" x1="330" y1="300" x2="575" y2="235"/>
  <path class="angle" d="M 384 266 A 64 64 0 0 1 392 284"/>
  <text class="label" x="562" y="150">gradient of z_m</text>
  <text class="label" x="585" y="238">semantic direction v</text>
  <text class="muted" x="405" y="264">positive alignment</text>

  <line class="arrow orth" x1="330" y1="300" x2="463" y2="510"/>
  <text class="muted" x="464" y="438">orthogonal: near-zero first-order effect</text>

  <line class="arrow opp" x1="330" y1="300" x2="125" y2="430"/>
  <text class="muted" x="78" y="446">opposite: negative effect</text>
</svg>
