<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Eight transformer blocks as repeated processing stages</title>
  <desc id="desc">A conceptual diagram showing a residual stream passing through transformer blocks 0 through 7. Each block contains attention followed by an MLP, and each block writes back to the residual stream.</desc>
  <style>
    .title { fill: #0f172a; font: 21px sans-serif; font-weight: 700; }
    .subtitle { fill: #475569; font: 13px sans-serif; }
    .stream { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
    .block { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .attn { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1; rx: 5; }
    .mlp { fill: #dcfce7; stroke: #4ade80; stroke-width: 1; rx: 5; }
    .label { fill: #0f172a; font: 14px sans-serif; }
    .small { fill: #475569; font: 12px sans-serif; }
    .mono { fill: #0f172a; font: 13px monospace; }
    .callout { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.2; rx: 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="900" height="430" fill="none"/>
  <text x="48" y="38" class="title">A Block Is One Repeated Processing Stage</text>
  <text x="48" y="62" class="subtitle">Othello-GPT applies eight blocks, indexed 0 through 7. Each block reads and updates the same residual stream.</text>

  <line x1="70" y1="222" x2="830" y2="222" class="stream"/>
  <text x="70" y="196" class="mono">tokens -> residual stream</text>
  <text x="690" y="196" class="mono">final logits</text>

  <g transform="translate(86 104)">
    <rect width="84" height="152" class="block"/>
    <text x="19" y="24" class="label">block 0</text>
    <rect x="12" y="46" width="60" height="32" class="attn"/>
    <text x="25" y="67" class="small">attn</text>
    <rect x="12" y="96" width="60" height="32" class="mlp"/>
    <text x="27" y="117" class="small">MLP</text>
  </g>
  <g transform="translate(184 104)">
    <rect width="84" height="152" class="block"/>
    <text x="19" y="24" class="label">block 1</text>
    <rect x="12" y="46" width="60" height="32" class="attn"/>
    <text x="25" y="67" class="small">attn</text>
    <rect x="12" y="96" width="60" height="32" class="mlp"/>
    <text x="27" y="117" class="small">MLP</text>
  </g>
  <g transform="translate(282 104)">
    <rect width="84" height="152" class="block"/>
    <text x="19" y="24" class="label">block 2</text>
    <rect x="12" y="46" width="60" height="32" class="attn"/>
    <text x="25" y="67" class="small">attn</text>
    <rect x="12" y="96" width="60" height="32" class="mlp"/>
    <text x="27" y="117" class="small">MLP</text>
  </g>
  <text x="386" y="184" class="label">...</text>
  <g transform="translate(426 104)">
    <rect width="84" height="152" class="block"/>
    <text x="19" y="24" class="label">block 5</text>
    <rect x="12" y="46" width="60" height="32" class="attn"/>
    <text x="25" y="67" class="small">attn</text>
    <rect x="12" y="96" width="60" height="32" class="mlp"/>
    <text x="27" y="117" class="small">MLP</text>
  </g>
  <g transform="translate(524 104)">
    <rect width="84" height="152" class="block"/>
    <text x="19" y="24" class="label">block 6</text>
    <rect x="12" y="46" width="60" height="32" class="attn"/>
    <text x="25" y="67" class="small">attn</text>
    <rect x="12" y="96" width="60" height="32" class="mlp"/>
    <text x="27" y="117" class="small">MLP</text>
  </g>
  <g transform="translate(622 104)">
    <rect width="84" height="152" class="block"/>
    <text x="19" y="24" class="label">block 7</text>
    <rect x="12" y="46" width="60" height="32" class="attn"/>
    <text x="25" y="67" class="small">attn</text>
    <rect x="12" y="96" width="60" height="32" class="mlp"/>
    <text x="27" y="117" class="small">MLP</text>
  </g>

  <g transform="translate(168 296)">
    <rect width="560" height="72" class="callout"/>
    <text x="18" y="28" class="label">Inside each block:</text>
    <text x="18" y="52" class="small">attention can mix information across token rows; the MLP transforms each row; both write 512-D updates back into the residual stream.</text>
  </g>
</svg>
