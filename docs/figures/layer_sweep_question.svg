<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="title desc">
  <title id="title">Layer sweep question</title>
  <desc id="desc">Eight neutral transformer blocks with question marks at candidate checkpoints.</desc>
  <style>
  svg {
    color-scheme: light dark;
    --text: #172033;
    --muted: #5e687c;
    --line: #243045;
    --grid: #d7dde8;
    --fill: #f7f9fc;
    --blue: #246bfe;
    --teal: #0f8f7f;
    --gold: #b98113;
    --red: #cc4b37;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --text: #eef2ff;
      --muted: #b8c1d3;
      --line: #dce3f7;
      --grid: #3b4558;
      --fill: #1f2633;
      --blue: #86a9ff;
      --teal: #5fd4c7;
      --gold: #ffd27a;
      --red: #ff8f7d;
    }
  }
  .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .label { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .small { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .tiny { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .box { fill: var(--fill); stroke: var(--grid); stroke-width: 1.4; rx: 8; }
  .pill { fill: transparent; stroke: var(--grid); stroke-width: 1.4; rx: 18; }
  .line { stroke: var(--line); stroke-width: 2.2; fill: none; }
  .dash { stroke: var(--grid); stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
  .arrow { stroke: var(--line); stroke-width: 2.2; fill: none; marker-end: url(#arrowLine); }
  .arrow-blue { stroke: var(--blue); stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
  .arrow-teal { stroke: var(--teal); stroke-width: 3; fill: none; marker-end: url(#arrowTeal); }
  .arrow-gold { stroke: var(--gold); stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
  .arrow-red { stroke: var(--red); stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
  .node { fill: var(--fill); stroke: var(--line); stroke-width: 1.6; }
</style>
  <defs>
  <marker id="arrowLine" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243045"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#246bfe"/></marker>
  <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8f7f"/></marker>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b98113"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#cc4b37"/></marker>
</defs>
  <text class="title" x="42" y="44">Where does legality-relevant structure emerge?</text>
  <rect class="box" x="70" y="170" width="70" height="62"/>
  <text class="label" x="105.0" y="198" text-anchor="middle">0</text>
  <text class="small" x="105.0" y="220" text-anchor="middle">block</text>
  <path class="arrow" d="M140 201 L165 201"/>
  <rect class="box" x="165" y="170" width="70" height="62"/>
  <text class="label" x="200.0" y="198" text-anchor="middle">1</text>
  <text class="small" x="200.0" y="220" text-anchor="middle">block</text>
  <path class="arrow" d="M235 201 L260 201"/>
  <rect class="box" x="260" y="170" width="70" height="62"/>
  <text class="label" x="295.0" y="198" text-anchor="middle">2</text>
  <text class="small" x="295.0" y="220" text-anchor="middle">block</text>
  <path class="arrow" d="M330 201 L355 201"/>
  <rect class="box" x="355" y="170" width="70" height="62"/>
  <text class="label" x="390.0" y="198" text-anchor="middle">3</text>
  <text class="small" x="390.0" y="220" text-anchor="middle">block</text>
  <path class="arrow" d="M425 201 L450 201"/>
  <rect class="box" x="450" y="170" width="70" height="62"/>
  <text class="label" x="485.0" y="198" text-anchor="middle">4</text>
  <text class="small" x="485.0" y="220" text-anchor="middle">block</text>
  <path class="arrow" d="M520 201 L545 201"/>
  <rect class="box" x="545" y="170" width="70" height="62"/>
  <text class="label" x="580.0" y="198" text-anchor="middle">5</text>
  <text class="small" x="580.0" y="220" text-anchor="middle">block</text>
  <path class="arrow" d="M615 201 L640 201"/>
  <rect class="box" x="640" y="170" width="70" height="62"/>
  <text class="label" x="675.0" y="198" text-anchor="middle">6</text>
  <text class="small" x="675.0" y="220" text-anchor="middle">block</text>
  <path class="arrow" d="M710 201 L735 201"/>
  <rect class="box" x="735" y="170" width="70" height="62"/>
  <text class="label" x="770.0" y="198" text-anchor="middle">7</text>
  <text class="small" x="770.0" y="220" text-anchor="middle">block</text>
  <text class="title" x="295" y="132" text-anchor="middle">?</text>
  <text class="tiny" x="295" y="260" text-anchor="middle">decodable?</text>
  <text class="title" x="485" y="132" text-anchor="middle">?</text>
  <text class="tiny" x="485" y="260" text-anchor="middle">board state?</text>
  <text class="title" x="675" y="132" text-anchor="middle">?</text>
  <text class="tiny" x="675" y="260" text-anchor="middle">sensitivity?</text>
  <text class="title" x="770" y="132" text-anchor="middle">?</text>
  <text class="tiny" x="770" y="260" text-anchor="middle">rule evidence?</text>
  <text class="label" x="86" y="335">Questions to test, not measured results.</text>
  <text class="small" x="86" y="365">All layers are shown neutrally here; Chapter 7 performs the sweep.</text>
</svg>
