<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Hidden board probe pipeline</title>
  <desc id="desc">A conceptual diagram showing an Othello move prefix entering Othello-GPT, a residual-stream activation being read by a linear probe, and the decoded board being compared with simulator labels.</desc>
  <defs>
    <style>
      .label { font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .soft { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .model { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.8; rx: 8; }
      .probe { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.8; rx: 8; }
      .truth { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; rx: 8; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .grid { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
      .empty { fill: #f8fafc; }
      .mine { fill: #2563eb; }
      .theirs { fill: #dc2626; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="30" y="54" width="170" height="86" class="box"/>
  <text x="52" y="88" class="label">move prefix</text>
  <text x="52" y="116" class="tiny">C4 C3 D3 E3 B2</text>

  <rect x="270" y="44" width="180" height="106" class="model"/>
  <text x="307" y="82" class="label">Othello-GPT</text>
  <text x="295" y="112" class="small">sequence model</text>
  <text x="301" y="133" class="tiny">no board image input</text>

  <rect x="510" y="44" width="190" height="106" class="soft"/>
  <text x="540" y="82" class="label">residual stream</text>
  <text x="548" y="112" class="small">one 512-d vector</text>
  <text x="540" y="133" class="tiny">layer 4, final prefix token</text>

  <rect x="770" y="44" width="170" height="106" class="probe"/>
  <text x="812" y="82" class="label">linear probe</text>
  <text x="798" y="112" class="small">64 squares x 3 states</text>
  <text x="816" y="133" class="tiny">empty / mine / theirs</text>

  <path d="M 200 97 L 266 97" class="arrow"/>
  <path d="M 450 97 L 506 97" class="arrow"/>
  <path d="M 700 97 L 766 97" class="arrow"/>

  <rect x="108" y="220" width="210" height="86" class="truth"/>
  <text x="137" y="253" class="label">exact simulator</text>
  <text x="132" y="282" class="small">replay the same prefix</text>

  <path d="M 115 140 C 115 178, 160 187, 205 218" class="dash"/>

  <g transform="translate(406 202)">
    <text x="0" y="-18" class="label">ground-truth labels</text>
    <g>
      <rect x="0" y="0" width="22" height="22" class="grid empty"/>
      <rect x="22" y="0" width="22" height="22" class="grid empty"/>
      <rect x="44" y="0" width="22" height="22" class="grid empty"/>
      <rect x="66" y="0" width="22" height="22" class="grid empty"/>
      <rect x="88" y="0" width="22" height="22" class="grid empty"/>
      <rect x="110" y="0" width="22" height="22" class="grid empty"/>
      <rect x="132" y="0" width="22" height="22" class="grid empty"/>
      <rect x="154" y="0" width="22" height="22" class="grid empty"/>
      <rect x="0" y="22" width="22" height="22" class="grid empty"/>
      <rect x="22" y="22" width="22" height="22" class="grid theirs"/>
      <rect x="44" y="22" width="22" height="22" class="grid empty"/>
      <rect x="66" y="22" width="22" height="22" class="grid empty"/>
      <rect x="88" y="22" width="22" height="22" class="grid empty"/>
      <rect x="110" y="22" width="22" height="22" class="grid empty"/>
      <rect x="132" y="22" width="22" height="22" class="grid empty"/>
      <rect x="154" y="22" width="22" height="22" class="grid empty"/>
      <rect x="0" y="44" width="22" height="22" class="grid empty"/>
      <rect x="22" y="44" width="22" height="22" class="grid empty"/>
      <rect x="44" y="44" width="22" height="22" class="grid mine"/>
      <rect x="66" y="44" width="22" height="22" class="grid mine"/>
      <rect x="88" y="44" width="22" height="22" class="grid empty"/>
      <rect x="110" y="44" width="22" height="22" class="grid empty"/>
      <rect x="132" y="44" width="22" height="22" class="grid empty"/>
      <rect x="154" y="44" width="22" height="22" class="grid empty"/>
      <rect x="0" y="66" width="22" height="22" class="grid empty"/>
      <rect x="22" y="66" width="22" height="22" class="grid empty"/>
      <rect x="44" y="66" width="22" height="22" class="grid theirs"/>
      <rect x="66" y="66" width="22" height="22" class="grid theirs"/>
      <rect x="88" y="66" width="22" height="22" class="grid theirs"/>
      <rect x="110" y="66" width="22" height="22" class="grid empty"/>
      <rect x="132" y="66" width="22" height="22" class="grid empty"/>
      <rect x="154" y="66" width="22" height="22" class="grid empty"/>
      <rect x="0" y="88" width="22" height="22" class="grid empty"/>
      <rect x="22" y="88" width="22" height="22" class="grid empty"/>
      <rect x="44" y="88" width="22" height="22" class="grid theirs"/>
      <rect x="66" y="88" width="22" height="22" class="grid mine"/>
      <rect x="88" y="88" width="22" height="22" class="grid theirs"/>
      <rect x="110" y="88" width="22" height="22" class="grid empty"/>
      <rect x="132" y="88" width="22" height="22" class="grid empty"/>
      <rect x="154" y="88" width="22" height="22" class="grid empty"/>
      <rect x="0" y="110" width="22" height="22" class="grid empty"/>
      <rect x="22" y="110" width="22" height="22" class="grid empty"/>
      <rect x="44" y="110" width="22" height="22" class="grid empty"/>
      <rect x="66" y="110" width="22" height="22" class="grid empty"/>
      <rect x="88" y="110" width="22" height="22" class="grid empty"/>
      <rect x="110" y="110" width="22" height="22" class="grid empty"/>
      <rect x="132" y="110" width="22" height="22" class="grid empty"/>
      <rect x="154" y="110" width="22" height="22" class="grid empty"/>
    </g>
  </g>

  <rect x="710" y="214" width="210" height="74" class="box"/>
  <text x="747" y="247" class="label">compare</text>
  <text x="735" y="275" class="small">probe prediction vs labels</text>
  <path d="M 855 150 L 855 210" class="arrow"/>
  <path d="M 582 262 L 706 252" class="arrow"/>

  <circle cx="768" cy="315" r="6" class="empty" stroke="#94a3b8"/>
  <text x="782" y="320" class="tiny">empty</text>
  <circle cx="838" cy="315" r="6" class="mine"/>
  <text x="852" y="320" class="tiny">mine</text>
  <circle cx="898" cy="315" r="6" class="theirs"/>
  <text x="912" y="320" class="tiny">theirs</text>
</svg>
