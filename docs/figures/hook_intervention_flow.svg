<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">TransformerLens hook intervention flow</title>
  <desc id="desc">Moves pass through early layers, a residual hook captures or edits h, later layers continue, and output move logits are read.</desc>
  <style>
    svg {
      color-scheme: light dark;
      --text: #172033;
      --muted: #5c667a;
      --stroke: #263247;
      --accent: #0f8f7f;
      --box: #dbeafe;
      --hook: #e9f7f5;
      --out: #fde68a;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --text: #eef2ff;
        --muted: #b7bfd1;
        --stroke: #dce4f4;
        --accent: #45d6c4;
        --box: #1d3158;
        --hook: #123532;
        --out: #4a3710;
      }
    }
    .title { fill: var(--text); font: 700 22px system-ui, -apple-system, Segoe UI, sans-serif; }
    .label { fill: var(--text); font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; }
    .muted { fill: var(--muted); font: 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .box { stroke: var(--stroke); stroke-width: 2; rx: 8; }
    .hook { stroke: var(--accent); stroke-width: 3; rx: 8; }
    .arrow { stroke: var(--accent); stroke-width: 4; fill: none; marker-end: url(#arrow); }
    .side { stroke: var(--accent); stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text class="title" x="56" y="40">Using a hook as a research instrument</text>
  <text class="muted" x="56" y="64">The hook is not part of the trained model; it lets us capture or edit one activation.</text>

  <rect class="box" x="270" y="92" width="220" height="62" fill="var(--box)"/>
  <text class="label" x="380" y="130" text-anchor="middle">moves</text>

  <line class="arrow" x1="380" y1="162" x2="380" y2="203"/>
  <rect class="box" x="270" y="214" width="220" height="62" fill="var(--box)"/>
  <text class="label" x="380" y="252" text-anchor="middle">layers 0...L</text>

  <line class="arrow" x1="380" y1="284" x2="380" y2="325"/>
  <rect class="hook" x="238" y="336" width="284" height="68" fill="var(--hook)"/>
  <text class="label" x="380" y="365" text-anchor="middle">hook_resid_post</text>
  <text class="muted" x="380" y="388" text-anchor="middle">capture or edit h</text>

  <path class="side" d="M 238 370 C 158 370, 158 298, 238 298"/>
  <text class="muted" x="62" y="303">research code reads h</text>
  <path class="side" d="M 522 370 C 620 370, 620 298, 522 298"/>
  <text class="muted" x="592" y="303">add delta h</text>

  <line class="arrow" x1="380" y1="412" x2="380" y2="443"/>
  <rect class="box" x="270" y="454" width="220" height="46" fill="var(--out)"/>
  <text class="label" x="380" y="483" text-anchor="middle">later layers -> move logits</text>
</svg>
