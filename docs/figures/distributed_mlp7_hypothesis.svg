<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
<title id="title">Distributed MLP7 hypothesis</title>
<desc id="desc">Current mechanistic hypothesis where several MLP7 neurons jointly contribute to a legality-relevant write.</desc>
<style>
svg{color-scheme:light dark;--text:#172033;--muted:#5c667a;--grid:#d8dde8;--fill:#f7f9fc;--target:#f2c94c;--opp:#cc4b37;--mine:#246bfe;--empty:#b8c0d0;--teal:#0f8f7f;--weak:#9aa3b7}
@media(prefers-color-scheme:dark){svg{--text:#eef2ff;--muted:#b7bfd1;--grid:#384153;--fill:#1f2633;--target:#ffd766;--opp:#ff8f7d;--mine:#86a9ff;--empty:#5a6578;--teal:#5fd4c7;--weak:#808ba0}}
.title{font:700 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--text)}.label{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--text)}.small{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--muted)}
.box{fill:var(--fill);stroke:var(--grid);stroke-width:1.3;rx:8}.line{stroke:var(--grid);stroke-width:2;fill:none;marker-end:url(#arrow)}.teal{stroke:var(--teal);stroke-width:3;fill:none;marker-end:url(#arrowTeal)}.weak{stroke:var(--weak);stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#arrowWeak)}
.target{fill:var(--target);stroke:var(--grid);stroke-width:1.2}.opp{fill:var(--opp);stroke:var(--grid);stroke-width:1.2}.mine{fill:var(--mine);stroke:var(--grid);stroke-width:1.2}.empty{fill:var(--empty);stroke:var(--grid);stroke-width:1.2}.frontier{stroke:var(--opp);stroke-width:2.4;stroke-dasharray:7 5}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5c667a"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8f7f"/></marker>
<marker id="arrowWeak" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9aa3b7"/></marker>
</defs>
<text class="title" x="42" y="48">Current hypothesis: a distributed MLP7 population</text>
<text class="small" x="42" y="72">Current mechanistic hypothesis -- not an established complete circuit.</text>
<rect class="box" x="64" y="156" width="190" height="96"/><text class="label" x="159" y="188" text-anchor="middle">mixed residual features</text><text class="small" x="159" y="213" text-anchor="middle">board state, move context,</text><text class="small" x="159" y="233" text-anchor="middle">attention-routed information</text>
<path class="teal" d="M254 204 L310 204"/>
<circle class="box" cx="340" cy="138" r="22"/><text class="small" x="340" y="142" text-anchor="middle">n</text><circle class="box" cx="408" cy="138" r="22"/><text class="small" x="408" y="142" text-anchor="middle">n</text><circle class="box" cx="476" cy="138" r="22"/><text class="small" x="476" y="142" text-anchor="middle">n</text><circle class="box" cx="340" cy="194" r="22"/><text class="small" x="340" y="198" text-anchor="middle">n</text><circle class="box" cx="408" cy="194" r="22"/><text class="small" x="408" y="198" text-anchor="middle">n</text><circle class="box" cx="476" cy="194" r="22"/><text class="small" x="476" y="198" text-anchor="middle">n</text><circle class="box" cx="340" cy="250" r="22"/><text class="small" x="340" y="254" text-anchor="middle">n</text><circle class="box" cx="408" cy="250" r="22"/><text class="small" x="408" y="254" text-anchor="middle">n</text><circle class="box" cx="476" cy="250" r="22"/><text class="small" x="476" y="254" text-anchor="middle">n</text>
<path class="teal" d="M540 204 L604 204"/>
<rect class="box" x="604" y="156" width="170" height="96"/><text class="label" x="689" y="188" text-anchor="middle">population write</text><text class="small" x="689" y="213" text-anchor="middle">legality-relevant</text><text class="small" x="689" y="233" text-anchor="middle">residual update</text>
<text class="small" x="334" y="304">Individual neurons can be selective, writer-like, polysemantic, or mostly silent in a given context.</text>
</svg>
