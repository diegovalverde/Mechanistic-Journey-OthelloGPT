<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" role="img" aria-labelledby="title desc">
  <title id="title">One Othello-GPT transformer block</title>
  <desc id="desc">Pre-norm attention and MLP block with residual additions and TransformerLens hooks.</desc>
  <style>
  svg {
    color-scheme: light dark;
    --text: #172033;
    --muted: #5e687c;
    --line: #243045;
    --grid: #d7dde8;
    --fill: #f7f9fc;
    --blue: #246bfe;
    --teal: #0f8f7f;
    --gold: #b98113;
    --red: #cc4b37;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --text: #eef2ff;
      --muted: #b8c1d3;
      --line: #dce3f7;
      --grid: #3b4558;
      --fill: #1f2633;
      --blue: #86a9ff;
      --teal: #5fd4c7;
      --gold: #ffd27a;
      --red: #ff8f7d;
    }
  }
  .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .label { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--text); }
  .small { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .tiny { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--muted); }
  .box { fill: var(--fill); stroke: var(--grid); stroke-width: 1.4; rx: 8; }
  .pill { fill: transparent; stroke: var(--grid); stroke-width: 1.4; rx: 18; }
  .line { stroke: var(--line); stroke-width: 2.2; fill: none; }
  .dash { stroke: var(--grid); stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
  .arrow { stroke: var(--line); stroke-width: 2.2; fill: none; marker-end: url(#arrowLine); }
  .arrow-blue { stroke: var(--blue); stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
  .arrow-teal { stroke: var(--teal); stroke-width: 3; fill: none; marker-end: url(#arrowTeal); }
  .arrow-gold { stroke: var(--gold); stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
  .arrow-red { stroke: var(--red); stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
  .node { fill: var(--fill); stroke: var(--line); stroke-width: 1.6; }
</style>
  <defs>
  <marker id="arrowLine" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243045"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#246bfe"/></marker>
  <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8f7f"/></marker>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b98113"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#cc4b37"/></marker>
</defs>
  <text class="title" x="42" y="44">One Othello-GPT block</text>
  <text class="small" x="42" y="70">512-D residual stream, block l</text>
  <rect class="box" x="250" y="105" width="260" height="55"/>
  <text class="label" x="380.0" y="133" text-anchor="middle">r_pre</text>
  <text class="small" x="380.0" y="155" text-anchor="middle">hook_resid_pre</text>
  <rect class="box" x="250" y="185" width="260" height="55"/>
  <text class="label" x="380.0" y="213" text-anchor="middle">LNPre</text>
  <text class="small" x="380.0" y="235" text-anchor="middle">attention input normalization</text>
  <rect class="box" x="250" y="265" width="260" height="55"/>
  <text class="label" x="380.0" y="293" text-anchor="middle">attention</text>
  <text class="small" x="380.0" y="315" text-anchor="middle">8 heads x 64</text>
  <rect class="box" x="250" y="350" width="260" height="55"/>
  <text class="label" x="380.0" y="378" text-anchor="middle">attn_out</text>
  <text class="small" x="380.0" y="400" text-anchor="middle">hook_attn_out</text>
  <rect class="box" x="250" y="430" width="260" height="55"/>
  <text class="label" x="380.0" y="458" text-anchor="middle">r_mid = r_pre + attn_out</text>
  <text class="small" x="380.0" y="480" text-anchor="middle">hook_resid_mid</text>
  <rect class="box" x="250" y="510" width="260" height="55"/>
  <text class="label" x="380.0" y="538" text-anchor="middle">MLP after LNPre</text>
  <text class="small" x="380.0" y="560" text-anchor="middle">512 -> 2048 -> 512</text>
  <rect class="box" x="250" y="595" width="260" height="55"/>
  <text class="label" x="380.0" y="623" text-anchor="middle">mlp_out</text>
  <text class="small" x="380.0" y="645" text-anchor="middle">hook_mlp_out</text>
  <rect class="box" x="250" y="675" width="260" height="55"/>
  <text class="label" x="380.0" y="703" text-anchor="middle">r_post = r_mid + mlp_out</text>
  <text class="small" x="380.0" y="725" text-anchor="middle">hook_resid_post</text>
  <path class="arrow" d="M380 160 L380 185"/>
  <path class="arrow" d="M380 240 L380 265"/>
  <path class="arrow" d="M380 320 L380 350"/>
  <path class="arrow" d="M380 405 L380 430"/>
  <path class="arrow" d="M380 485 L380 510"/>
  <path class="arrow" d="M380 565 L380 595"/>
  <path class="arrow" d="M380 650 L380 675"/>
  <path class="arrow-blue" d="M250 132 L185 132"/>
  <path class="arrow-blue" d="M185 132 L185 378"/>
  <path class="arrow-blue" d="M185 378 L250 378"/>
  <text class="small" x="86" y="126">residual add</text>
  <path class="arrow-teal" d="M510 458 L585 458"/>
  <path class="arrow-teal" d="M585 458 L585 702"/>
  <path class="arrow-teal" d="M585 702 L510 702"/>
  <text class="small" x="590" y="451">residual add</text>
  <text class="label" x="84" y="748">r_post(layer l) = r_pre(layer l+1)</text>
</svg>
