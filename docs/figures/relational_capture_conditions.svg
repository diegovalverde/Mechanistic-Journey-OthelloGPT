<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
<title id="title">Relational capture conditions</title>
<desc id="desc">Matched structural ray conditions for testing candidate MLP7 neurons.</desc>
<style>
svg{color-scheme:light dark;--text:#172033;--muted:#5c667a;--grid:#d8dde8;--fill:#f7f9fc;--target:#f2c94c;--opp:#cc4b37;--mine:#246bfe;--empty:#b8c0d0;--teal:#0f8f7f;--weak:#9aa3b7}
@media(prefers-color-scheme:dark){svg{--text:#eef2ff;--muted:#b7bfd1;--grid:#384153;--fill:#1f2633;--target:#ffd766;--opp:#ff8f7d;--mine:#86a9ff;--empty:#5a6578;--teal:#5fd4c7;--weak:#808ba0}}
.title{font:700 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--text)}.label{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--text)}.small{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--muted)}
.box{fill:var(--fill);stroke:var(--grid);stroke-width:1.3;rx:8}.line{stroke:var(--grid);stroke-width:2;fill:none;marker-end:url(#arrow)}.teal{stroke:var(--teal);stroke-width:3;fill:none;marker-end:url(#arrowTeal)}.weak{stroke:var(--weak);stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#arrowWeak)}
.target{fill:var(--target);stroke:var(--grid);stroke-width:1.2}.opp{fill:var(--opp);stroke:var(--grid);stroke-width:1.2}.mine{fill:var(--mine);stroke:var(--grid);stroke-width:1.2}.empty{fill:var(--empty);stroke:var(--grid);stroke-width:1.2}.frontier{stroke:var(--opp);stroke-width:2.4;stroke-dasharray:7 5}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5c667a"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8f7f"/></marker>
<marker id="arrowWeak" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9aa3b7"/></marker>
</defs>
<text class="title" x="42" y="48">Relational capture conditions</text>
<text class="small" x="42" y="72">Matched structural conditions used to ask whether MLP7 neurons distinguish the relational ingredients of Othello legality.</text>
<text class="label" x="64" y="139">valid capture</text><circle class="target" cx="230" cy="120" r="19"/><text class="label" x="230" y="125" text-anchor="middle">T</text><line class="line" x1="254" y1="120" x2="284" y2="120"/><circle class="opp" cx="308" cy="120" r="19"/><text class="label" x="308" y="125" text-anchor="middle">O</text><line class="line" x1="332" y1="120" x2="362" y2="120"/><circle class="opp" cx="386" cy="120" r="19"/><text class="label" x="386" y="125" text-anchor="middle">O</text><line class="line" x1="410" y1="120" x2="440" y2="120"/><circle class="mine" cx="464" cy="120" r="19"/><text class="label" x="464" y="125" text-anchor="middle">M</text><text class="small" x="600" y="125">legal ray</text><text class="label" x="64" y="211">no terminator</text><circle class="target" cx="230" cy="192" r="19"/><text class="label" x="230" y="197" text-anchor="middle">T</text><line class="line" x1="254" y1="192" x2="284" y2="192"/><circle class="opp" cx="308" cy="192" r="19"/><text class="label" x="308" y="197" text-anchor="middle">O</text><line class="line" x1="332" y1="192" x2="362" y2="192"/><circle class="opp" cx="386" cy="192" r="19"/><text class="label" x="386" y="197" text-anchor="middle">O</text><line class="line" x1="410" y1="192" x2="440" y2="192"/><circle class="empty" cx="464" cy="192" r="19"/><text class="label" x="464" y="197" text-anchor="middle">E</text><text class="small" x="600" y="197">invalid</text><text class="label" x="64" y="283">friendly adjacent</text><circle class="target" cx="230" cy="264" r="19"/><text class="label" x="230" y="269" text-anchor="middle">T</text><line class="line" x1="254" y1="264" x2="284" y2="264"/><circle class="mine" cx="308" cy="264" r="19"/><text class="label" x="308" y="269" text-anchor="middle">M</text><text class="small" x="600" y="269">invalid</text><text class="label" x="64" y="355">empty adjacent</text><circle class="target" cx="230" cy="336" r="19"/><text class="label" x="230" y="341" text-anchor="middle">T</text><line class="line" x1="254" y1="336" x2="284" y2="336"/><circle class="empty" cx="308" cy="336" r="19"/><text class="label" x="308" y="341" text-anchor="middle">E</text><text class="small" x="600" y="341">invalid</text><text class="label" x="64" y="427">broken line</text><circle class="target" cx="230" cy="408" r="19"/><text class="label" x="230" y="413" text-anchor="middle">T</text><line class="line" x1="254" y1="408" x2="284" y2="408"/><circle class="opp" cx="308" cy="408" r="19"/><text class="label" x="308" y="413" text-anchor="middle">O</text><line class="line" x1="332" y1="408" x2="362" y2="408"/><circle class="empty" cx="386" cy="408" r="19"/><text class="label" x="386" y="413" text-anchor="middle">E</text><line class="line" x1="410" y1="408" x2="440" y2="408"/><circle class="mine" cx="464" cy="408" r="19"/><text class="label" x="464" y="413" text-anchor="middle">M</text><text class="small" x="600" y="413">invalid control</text>
<circle class="target" cx="94" cy="476" r="9"/><text class="small" x="110" y="480">target</text>
<circle class="opp" cx="174" cy="476" r="9"/><text class="small" x="190" y="480">opponent</text>
<circle class="mine" cx="272" cy="476" r="9"/><text class="small" x="288" y="480">friendly</text>
<circle class="empty" cx="358" cy="476" r="9"/><text class="small" x="374" y="480">empty</text>
</svg>
